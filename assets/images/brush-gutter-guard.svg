<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Sky background -->
    <linearGradient id="brushSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Shingle Gradient -->
    <linearGradient id="brushRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Fascia Board -->
    <linearGradient id="brushFascia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Gutter Outer Metal -->
    <linearGradient id="brushGutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F1F5F9"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Steel wire core gradient -->
    <linearGradient id="wireCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="brushShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="450" fill="url(#brushSky)"/>

  <!-- Siding in background -->
  <rect x="0" y="160" width="800" height="290" fill="#F8FAFC"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="0" y1="310" x2="800" y2="310" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Fascia Board -->
  <polygon points="0,110 800,110 800,210 0,210" fill="url(#brushFascia)"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#94A3B8" stroke-width="2"/>

  <!-- Roof Shingles -->
  <polygon points="0,0 800,0 800,125 0,125" fill="url(#brushRoof)"/>
  <polygon points="0,40 800,40 800,46 0,46" fill="#0F172A" opacity="0.6"/>
  <polygon points="0,80 800,80 800,87 0,87" fill="#0F172A" opacity="0.6"/>
  <polygon points="0,120 800,120 800,128 0,128" fill="#020617" opacity="0.8"/>
  <polygon points="0,124 800,124 800,132 0,132" fill="#E2E8F0"/>

  <!-- Shadow under gutter -->
  <polygon points="0,130 800,130 800,165 0,165" fill="#0F172A" opacity="0.3"/>

  <!-- Gutter Back Wall -->
  <polygon points="40,135 760,135 760,265 40,265" fill="#94A3B8"/>

  <!-- BRUSH GUTTER GUARD (Cylindrical Polypropylene Bristles on Twisted Steel Wire) -->
  <g id="gutterBrush" filter="url(#brushShadow)">
    <!-- Twisted Galvanized Steel Center Wire Spine -->
    <rect x="40" y="195" width="720" height="12" rx="4" fill="url(#wireCore)"/>
    <path d="M40,201 Q100,195 160,201 T280,201 T400,201 T520,201 T640,201 T760,201" stroke="#94A3B8" stroke-width="3" fill="none"/>

    <!-- High Density Radiating Bristles (Black Polypropylene) -->
    <!-- Upward and Angled Bristles -->
    <g stroke="#1E293B" stroke-width="2.2" opacity="0.85" stroke-linecap="round">
      <!-- Section 1 -->
      <line x1="60" y1="201" x2="45" y2="140"/><line x1="65" y1="201" x2="60" y2="135"/><line x1="70" y1="201" x2="75" y2="138"/>
      <line x1="90" y1="201" x2="75" y2="142"/><line x1="95" y1="201" x2="90" y2="136"/><line x1="100" y1="201" x2="105" y2="138"/>
      <line x1="120" y1="201" x2="105" y2="140"/><line x1="125" y1="201" x2="120" y2="135"/><line x1="130" y1="201" x2="135" y2="137"/>
      <line x1="150" y1="201" x2="135" y2="142"/><line x1="155" y1="201" x2="150" y2="136"/><line x1="160" y1="201" x2="165" y2="139"/>
      <line x1="180" y1="201" x2="165" y2="140"/><line x1="185" y1="201" x2="180" y2="135"/><line x1="190" y1="201" x2="195" y2="138"/>
      <line x1="210" y1="201" x2="195" y2="141"/><line x1="215" y1="201" x2="210" y2="135"/><line x1="220" y1="201" x2="225" y2="138"/>
      <line x1="240" y1="201" x2="225" y2="142"/><line x1="245" y1="201" x2="240" y2="136"/><line x1="250" y1="201" x2="255" y2="139"/>
      <line x1="270" y1="201" x2="255" y2="140"/><line x1="275" y1="201" x2="270" y2="135"/><line x1="280" y1="201" x2="285" y2="137"/>
      <line x1="300" y1="201" x2="285" y2="141"/><line x1="305" y1="201" x2="300" y2="136"/><line x1="310" y1="201" x2="315" y2="138"/>
      <line x1="330" y1="201" x2="315" y2="140"/><line x1="335" y1="201" x2="330" y2="135"/><line x1="340" y1="201" x2="345" y2="138"/>
      <line x1="360" y1="201" x2="345" y2="142"/><line x1="365" y1="201" x2="360" y2="136"/><line x1="370" y1="201" x2="375" y2="139"/>
      <line x1="390" y1="201" x2="375" y2="140"/><line x1="395" y1="201" x2="390" y2="135"/><line x1="400" y1="201" x2="405" y2="137"/>
      <line x1="420" y1="201" x2="405" y2="141"/><line x1="425" y1="201" x2="420" y2="136"/><line x1="430" y1="201" x2="435" y2="138"/>
      <line x1="450" y1="201" x2="435" y2="140"/><line x1="455" y1="201" x2="450" y2="135"/><line x1="460" y1="201" x2="465" y2="138"/>
      <line x1="480" y1="201" x2="465" y2="142"/><line x1="485" y1="201" x2="480" y2="136"/><line x1="490" y1="201" x2="495" y2="139"/>
      <line x1="510" y1="201" x2="495" y2="140"/><line x1="515" y1="201" x2="510" y2="135"/><line x1="520" y1="201" x2="525" y2="137"/>
      <line x1="540" y1="201" x2="525" y2="141"/><line x1="545" y1="201" x2="540" y2="136"/><line x1="550" y1="201" x2="555" y2="138"/>
      <line x1="570" y1="201" x2="555" y2="140"/><line x1="575" y1="201" x2="570" y2="135"/><line x1="580" y1="201" x2="585" y2="138"/>
      <line x1="600" y1="201" x2="585" y2="142"/><line x1="605" y1="201" x2="600" y2="136"/><line x1="610" y1="201" x2="615" y2="139"/>
      <line x1="630" y1="201" x2="615" y2="140"/><line x1="635" y1="201" x2="630" y2="135"/><line x1="640" y1="201" x2="645" y2="137"/>
      <line x1="660" y1="201" x2="645" y2="141"/><line x1="665" y1="201" x2="660" y2="136"/><line x1="670" y1="201" x2="675" y2="138"/>
      <line x1="690" y1="201" x2="675" y2="140"/><line x1="695" y1="201" x2="690" y2="135"/><line x1="700" y1="201" x2="705" y2="138"/>
      <line x1="720" y1="201" x2="705" y2="142"/><line x1="725" y1="201" x2="720" y2="136"/><line x1="730" y1="201" x2="735" y2="139"/>
    </g>

    <!-- Additional overlapping dense bristle cloud -->
    <g stroke="#0F172A" stroke-width="1.8" opacity="0.9" stroke-linecap="round">
      <!-- Angled & forward bristles -->
      <line x1="50" y1="201" x2="52" y2="145"/><line x1="80" y1="201" x2="82" y2="143"/>
      <line x1="110" y1="201" x2="114" y2="146"/><line x1="140" y1="201" x2="142" y2="144"/>
      <line x1="170" y1="201" x2="173" y2="145"/><line x1="200" y1="201" x2="204" y2="143"/>
      <line x1="230" y1="201" x2="232" y2="146"/><line x1="260" y1="201" x2="265" y2="144"/>
      <line x1="290" y1="201" x2="293" y2="145"/><line x1="320" y1="201" x2="322" y2="143"/>
      <line x1="350" y1="201" x2="354" y2="146"/><line x1="380" y1="201" x2="382" y2="144"/>
      <line x1="410" y1="201" x2="413" y2="145"/><line x1="440" y1="201" x2="442" y2="143"/>
      <line x1="470" y1="201" x2="474" y2="146"/><line x1="500" y1="201" x2="502" y2="144"/>
      <line x1="530" y1="201" x2="533" y2="145"/><line x1="560" y1="201" x2="562" y2="143"/>
      <line x1="590" y1="201" x2="594" y2="146"/><line x1="620" y1="201" x2="622" y2="144"/>
      <line x1="650" y1="201" x2="653" y2="145"/><line x1="680" y1="201" x2="682" y2="143"/>
      <line x1="710" y1="201" x2="714" y2="146"/><line x1="740" y1="201" x2="742" y2="144"/>
    </g>

    <!-- Downward bristles into channel bottom -->
    <g stroke="#334155" stroke-width="2" opacity="0.75" stroke-linecap="round">
      <line x1="70" y1="207" x2="65" y2="255"/><line x1="120" y1="207" x2="125" y2="255"/>
      <line x1="170" y1="207" x2="165" y2="255"/><line x1="220" y1="207" x2="225" y2="255"/>
      <line x1="270" y1="207" x2="265" y2="255"/><line x1="320" y1="207" x2="325" y2="255"/>
      <line x1="370" y1="207" x2="365" y2="255"/><line x1="420" y1="207" x2="425" y2="255"/>
      <line x1="470" y1="207" x2="465" y2="255"/><line x1="520" y1="207" x2="525" y2="255"/>
      <line x1="570" y1="207" x2="565" y2="255"/><line x1="620" y1="207" x2="625" y2="255"/>
      <line x1="670" y1="207" x2="665" y2="255"/><line x1="720" y1="207" x2="715" y2="255"/>
    </g>
  </g>

  <!-- Gutter Front Lip and Profile (White K-Style Gutter) -->
  <polygon points="30,150 770,150 770,270 30,270" fill="url(#brushGutter)" opacity="0.95" filter="url(#brushShadow)"/>
  <polygon points="30,150 770,150 770,162 30,162" fill="#FFFFFF"/>
  <line x1="30" y1="162" x2="770" y2="162" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="30,185 770,185 770,195 30,195" fill="#E2E8F0"/>
  <polygon points="30,250 770,250 770,270 30,270" fill="#94A3B8"/>
  <line x1="30" y1="270" x2="770" y2="270" stroke="#64748B" stroke-width="3"/>

  <!-- Fallen oak & pine leaves blocked on top of bristles -->
  <g opacity="0.95">
    <path d="M 280,132 C 300,118 325,122 335,135 C 325,148 298,142 280,132 Z" fill="#D97706"/>
    <path d="M 440,130 C 455,115 480,120 488,134 C 475,146 450,140 440,130 Z" fill="#B45309"/>
    <!-- Pine needles resting on bristles -->
    <line x1="560" y1="130" x2="595" y2="138" stroke="#78350F" stroke-width="2"/>
    <line x1="565" y1="132" x2="602" y2="135" stroke="#92400E" stroke-width="1.8"/>
    <line x1="562" y1="135" x2="598" y2="142" stroke="#B45309" stroke-width="2"/>
  </g>

  <!-- Product Label Badge -->
  <g transform="translate(40, 375)">
    <rect width="210" height="42" rx="6" fill="#1B2A4A" opacity="0.92"/>
    <rect x="0" y="0" width="6" height="42" rx="2" fill="#C8922A"/>
    <text x="18" y="26" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Brush Gutter Guard</text>
  </g>
</svg>
